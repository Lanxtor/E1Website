<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — LANXTOR E1</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css?v=9">
</head>
<body>
  <div id="site-header"></div>

  <main class="auth">
    <div class="auth-box" data-auth>
      <h1 data-auth-title>Welcome back</h1>
      <p>Access your E1 cloud workspace and usage.</p>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-mode="login" aria-selected="true">Log in</button>
        <button type="button" role="tab" data-mode="signup" aria-selected="false">Sign up</button>
      </div>

      <form novalidate>
        <div class="field" data-signup-only hidden>
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name">
        </div>
        <div class="field" data-signup-only hidden>
          <label for="company">Company</label>
          <input id="company" name="company" type="text" autocomplete="organization">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit" data-auth-submit>Log in</button>
      </form>

      <p class="notice" hidden>Accounts are coming soon. This form is not connected yet.</p>
    </div>
  </main>

  <script src="assets/js/main.js?v=8"></script>
</body>
</html>
