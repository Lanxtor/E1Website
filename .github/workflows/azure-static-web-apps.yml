# Publishes the website to Azure Static Web Apps (docs/AZURE-INTEGRATION.md).
#
# Every push to main publishes two versions of the same files:
#   - the full site to the second Static Web App, e1-website-preview
#     (preview.lanxtor.com, password-protected in the portal: Configuration →
#     Password protection), with the secret AZURE_STATIC_WEB_APPS_PREVIEW_TOKEN;
#   - the public site (lanxtor.com): the coming-soon page for every address,
#     until the repository variable SITE_MODE is set to "live"
#     (Settings → Secrets and variables → Actions → Variables).
# Pull requests get their own preview address with the full site.
#
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (the Static Web
# App's deployment token); without it the job only says so.
#
# Every deployment also publishes /version.json, {"commit", "builtAt"}: the
# commit that is live, read by the owner's review boards (only the deployed
# site counts for a review, as only app.lanxtor.com does for the app).
name: Website on Azure

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:
  # Every working day after the European Central Bank publishes its rates,
  # so the prices in EUR, GBP and NOK follow the day's exchange rate.
  schedule:
    - cron: "35 15 * * 1-5"

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      PREVIEW_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_PREVIEW_TOKEN }}
      SITE_MODE: ${{ vars.SITE_MODE }}
    steps:
      - uses: actions/checkout@v4

      - name: Version stamp (/version.json names the commit that is live)
        run: printf '{"commit":"%s","builtAt":"%s"}\n' "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json

      - name: Exchange rates (/assets/data/rates.json, from the European Central Bank)
        # Keeps the committed fallback when the ECB cannot be reached.
        run: |
          python3 - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          try:
              xml = urllib.request.urlopen("https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml", timeout=30).read()
              ns = {"e": "http://www.ecb.int/vocabulary/2002-08-01/eurofxref"}
              day = ET.fromstring(xml).find(".//e:Cube[@time]", ns)
              rates = {c.get("currency"): float(c.get("rate")) for c in day.findall("e:Cube", ns)}
              out = {"source": "European Central Bank euro reference rates", "base": "EUR", "date": day.get("time"),
                     "rates": {k: rates[k] for k in ("USD", "GBP", "NOK")}}
              json.dump(out, open("assets/data/rates.json", "w"), indent=2)
              print("Rates of", out["date"], out["rates"])
          except Exception as e:
              print("::warning::Exchange rates not updated:", e)
          PY

      - name: Website knowledge for the Alex assistant (api/knowledge.txt)
        run: python3 tools/chat/build_knowledge.py

      - name: No deployment token yet
        if: env.TOKEN == ''
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set; nothing deployed. See docs/AZURE-INTEGRATION.md."

      - name: Full site to e1-website-preview (preview.lanxtor.com)
        if: env.PREVIEW_TOKEN != '' && github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_PREVIEW_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          skip_app_build: true

      - name: Public site shows the coming-soon page (SITE_MODE is not "live")
        if: env.TOKEN != '' && github.event_name != 'pull_request' && env.SITE_MODE != 'live'
        run: |
          jq '.routes = [{"route": "/assets/*", "allowedRoles": ["anonymous"]}, {"route": "/version.json", "allowedRoles": ["anonymous"], "headers": {"Cache-Control": "no-store"}}, {"route": "/*", "rewrite": "/coming-soon.html"}] | del(.responseOverrides)' staticwebapp.config.json > config.tmp
          mv config.tmp staticwebapp.config.json
          echo "::notice::lanxtor.com shows the coming-soon page. Set the repository variable SITE_MODE to live to publish the full site."

      - name: Public site (production), or the pull request's preview
        if: env.TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          skip_app_build: true

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Remove the preview address
        if: env.TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: /
